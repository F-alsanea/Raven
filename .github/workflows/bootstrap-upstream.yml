name: Bootstrap DeepSeek Harness upstream

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raven
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import DeepSeek Harness snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "raven-bootstrap[bot]"
          git config user.email "raven-bootstrap[bot]@users.noreply.github.com"
          git remote add deepseek https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch deepseek master --tags
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"

          git checkout --orphan upstream-snapshot
          git rm -rf . >/dev/null 2>&1 || true
          git checkout "$UPSTREAM_SHA" -- .
          rm -rf .github/workflows
          printf '%s\n' "$UPSTREAM_SHA" > .raven-upstream-sha
          git add -A
          git commit -m "chore: import DeepSeek Harness upstream snapshot $UPSTREAM_SHA"
          git branch -M upstream/deepseek-harness
          git push origin upstream/deepseek-harness --force

      - name: Create Raven integration branch
        shell: bash
        env:
          RAVEN_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail
          git checkout -B raven/integration upstream/deepseek-harness
          git checkout "$RAVEN_MAIN" -- README.md NOTICE.md
          if [ -f LICENSE ]; then
            mv LICENSE LICENSE.deepseek-harness
          fi
          git checkout "$RAVEN_MAIN" -- LICENSE
          cat > RAVEN_UPSTREAM.md <<'EOF'
          # Raven upstream tracking

          Raven is based on DeepSeek Harness.

          - Upstream repository: `https://github.com/deepseek-ai/deepseek-harness.git`
          - Upstream branch: `master`
          - Mirrored snapshot branch: `upstream/deepseek-harness`
          - Raven development branch: `raven/integration`
          - Exact imported upstream commit: see `.raven-upstream-sha`

          Upstream GitHub workflow files are intentionally excluded from the mirrored snapshot because the repository automation token cannot publish third-party workflow files. Raven owns its own CI workflows.

          The original DeepSeek Harness license is preserved as `LICENSE.deepseek-harness`.
          Raven-specific code is covered by the repository `LICENSE`, unless otherwise noted.
          EOF
          git add README.md NOTICE.md LICENSE LICENSE.deepseek-harness RAVEN_UPSTREAM.md .raven-upstream-sha
          git commit -m "chore: establish Raven integration branch"
          git push origin raven/integration --force
