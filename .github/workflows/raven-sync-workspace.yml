name: Raven Sync Workspace Metadata

on:
  push:
    branches:
      - raven/m1-control-plane
    paths:
      - '.github/workflows/raven-sync-workspace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Register Raven source aliases and host projects
        shell: python
        run: |
          from pathlib import Path

          base = Path('tsconfig.base.json')
          text = base.read_text()
          alias_anchor = '      // BEGIN generated package aliases — pnpm run gen-tsconfig-paths'
          aliases = (
              '      "@deepseek-ai/dsh-raven-control-plane": ["./packages/raven/control-plane/src"],\n'
              '      "@deepseek-ai/dsh-raven-control-plane-runtime": ["./packages/raven/control-plane-runtime/src"],\n'
          )
          if '"@deepseek-ai/dsh-raven-control-plane"' not in text:
              if alias_anchor not in text:
                  raise SystemExit('tsconfig.base.json generated-alias anchor not found')
              text = text.replace(alias_anchor, aliases + alias_anchor, 1)
              base.write_text(text)

          host = Path('tsconfig.host.json')
          text = host.read_text()
          host_anchor = '    { "path": "./apps/cli" },'
          refs = (
              '    { "path": "./packages/raven/control-plane" },\n'
              '    { "path": "./packages/raven/control-plane-runtime" },\n'
          )
          if '"./packages/raven/control-plane"' not in text:
              if host_anchor not in text:
                  raise SystemExit('tsconfig.host.json insertion anchor not found')
              text = text.replace(host_anchor, refs + host_anchor, 1)
              host.write_text(text)

      - name: Verify generated package aliases
        run: pnpm run gen-tsconfig-paths

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify source resolution
        run: pnpm run verify-tsconfig-paths

      - name: Commit workspace metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "raven-workspace[bot]"
          git config user.email "raven-workspace[bot]@users.noreply.github.com"
          git add tsconfig.base.json tsconfig.host.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Workspace metadata already synchronized."
            exit 0
          fi
          git commit -m "chore(raven): sync workspace metadata"
          git push origin HEAD:raven/m1-control-plane
