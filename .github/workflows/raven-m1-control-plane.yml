name: Raven M1 Control Plane

on:
  push:
    branches:
      - raven/m1-control-plane
    paths:
      - 'packages/raven/control-plane/**'
      - '.github/workflows/raven-m1-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm exec vitest run packages/raven/control-plane/tests

      - name: Typecheck package
        run: pnpm exec tsc -p packages/raven/control-plane/tsconfig.json --noEmit
